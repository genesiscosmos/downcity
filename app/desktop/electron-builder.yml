appId: ai.downcity.desktop
productName: Downcity
npmRebuild: false
artifactName: downcity-${version}.${ext}
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/agent-avatars
    to: agent-avatars
icon: build/icon.icns
win:
  icon: build/icon.ico
  target:
    - nsis
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  identity: "Zheng Wang (76Y42WCHN4)"
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: false
  target:
    - dmg
    - zip
linux:
  icon: build/icons
  category: Development
  target:
    - AppImage

publish:
  provider: generic
  url: https://downcity.ai/download/macos
