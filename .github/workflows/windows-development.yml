name: Windows development support

on:
  pull_request:
    paths:
      - ".github/workflows/windows-development.yml"
      - "packages/agent/**"
      - "packages/city/**"
      - "packages/federation/**"
      - "app/cli/**"
      - "app/fedman/**"
      - "packages/implementations/plugins/**"
      - "packages/implementations/sandboxes/microsandbox/**"
      - "packages/type/**"
      - "packages/ui/**"
      - "scripts/clean-package.mjs"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-development.yml"
      - "packages/agent/**"
      - "packages/city/**"
      - "packages/federation/**"
      - "app/cli/**"
      - "app/fedman/**"
      - "packages/implementations/plugins/**"
      - "packages/implementations/sandboxes/microsandbox/**"
      - "packages/type/**"
      - "packages/ui/**"
      - "scripts/clean-package.mjs"
      - "pnpm-lock.yaml"
  workflow_dispatch:

jobs:
  windows-development:
    name: Native Windows SDK and microsandbox
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI dependency closure
        run: pnpm -r --filter "downcity..." build

      - name: Verify Windows command model
        run: node --test packages/city/test/shell-command-model.test.mjs app/cli/scripts/env-file.test.mjs

      - name: Verify CLI platform storage
        working-directory: app/cli
        run: node --test scripts/config-storage.test.mjs

      - name: Typecheck affected packages
        shell: pwsh
        run: |
          pnpm -C packages/implementations/sandboxes/microsandbox typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm -C packages/agent typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm -C packages/city typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm -C app/cli typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
