<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Downcity Federation</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">D</span><div><strong>Downcity</strong><small>FEDERATION</small></div></div>
        <nav id="navigation"></nav>
        <div class="connection"><span class="status-dot"></span><div><small>CONNECTED TO</small><strong id="federation-name">Loading…</strong><span id="federation-url"></span></div></div>
      </aside>
      <main>
        <header>
          <div><p class="eyebrow">LOCAL CONTROL PLANE</p><h1 id="page-title">Dashboard</h1><p id="page-description">Federation 运行状态与核心指标</p></div>
          <div class="header-actions"><select id="range"><option value="today">今日</option><option value="7d">7 天</option><option value="30d" selected>30 天</option><option value="all">全部</option></select><button id="refresh">刷新</button></div>
        </header>
        <section id="content" aria-live="polite"></section>
      </main>
    </div>
    <div id="toast" role="status"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
