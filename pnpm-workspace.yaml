packages:
  - packages/*
  - remote
  - packages/implementations/databases/*
  - packages/implementations/powers
  - packages/implementations/sandboxes/*
  - packages/implementations/services
  - packages/implementations/workspaces/*
  - templates/*
  - templates/agent/server
  - templates/agent/web
  # 可复制的独立作者项目使用 registry 依赖，不参与宿主 workspace 安装。
  - "!templates/notes-power"

allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true
  sharp: true
  workerd: true

onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - node-pty
